[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid_recon"
version = "1.0.0"
description = "Independent reconstruction of a paraffin/LOX hybrid-rocket many-objective design model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "pymoo>=0.6.1", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
